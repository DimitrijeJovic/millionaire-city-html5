<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Millionaire City</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="assets/fonts/fonts.css">
<link rel="stylesheet" href="css/game.css">
</head>
<body>
<div id="loading-screen"><img src="assets/icons/Background_loading.png" alt="Loading"></div>
<div id="game"></div>
<div id="hud"></div>
<aside id="info-panel" hidden></aside>
<aside id="contract-panel" hidden></aside>
<div id="map-info"></div>
<div id="visit-banner" hidden></div>
<div id="bottom-bar"></div>
<div id="toolbar"></div>
<div id="shop-panel" hidden></div>
<div id="storage-panel" hidden></div>
<div id="missions"></div>
<div id="rain-back"></div>
<div id="popup-host" hidden></div>
<div id="level-popup" hidden></div>
<div id="rain-front"></div>
<div id="profile-host"></div>
<script src="vendor/phaser.min.js"></script>
<script type="module">
// The game assets are generated locally (README, "Preparing the Game Assets"); without them, say so instead of failing silently.
const assetsReady = await fetch("assets/manifest.json").then((r) => r.ok, () => false);
if (assetsReady) await import("./js/main.js");
else document.getElementById("loading-screen").textContent =
  "Game assets not found in public/assets/. They are not included in the repository; generate them from your own " +
  "original game files with tools/build_assets.py (see README, \"Preparing the Game Assets\").";
</script>
</body>
</html>
