<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Millionaire City</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="assets/fonts/fonts.css">
<link rel="stylesheet" href="css/game.css">
</head>
<body>
<div id="loading-screen"><img src="assets/icons/Background_loading.png" alt="Loading"></div>
<div id="game"></div>
<div id="hud"></div>
<aside id="info-panel" hidden></aside>
<aside id="contract-panel" hidden></aside>
<div id="map-info"></div>
<div id="visit-banner" hidden></div>
<div id="bottom-bar"></div>
<div id="toolbar"></div>
<div id="shop-panel" hidden></div>
<div id="storage-panel" hidden></div>
<div id="missions"></div>
<div id="rain-back"></div>
<div id="popup-host" hidden></div>
<div id="level-popup" hidden></div>
<div id="rain-front"></div>
<div id="profile-host"></div>
<script src="vendor/phaser.min.js"></script>
<script type="module">
// Game assets and city data are generated locally (README); without them, say so instead of failing silently.
// The city file is chosen exactly as in CityScene.preload.
const query = new URLSearchParams(location.search);
const { cityDataFile } = await import("./js/game/city.js");
const { isNpcCityFile } = await import("./js/game/visitMode.js");
const visit = query.get("visit");
const cityFile = cityDataFile(isNpcCityFile(visit) ? visit : query.get("city"));
const exists = (url) => fetch(url).then((r) => r.ok, () => false);
const missing = [];
if (!(await exists("assets/manifest.json"))) missing.push("game assets in public/assets/ (tools/build_assets.py)");
if (!(await exists(cityFile))) missing.push("city data public/" + cityFile + " (tools/convert_save.py or tools/convert_universe_xml.py)");
if (!missing.length) await import("./js/main.js");
else document.getElementById("loading-screen").textContent =
  "Not found: " + missing.join("; ") + ". These files are not included in the repository; generate them from your own " +
  "original game files (see README, \"Preparing the Game Assets\" and \"Preparing the City Data\").";
</script>
</body>
</html>
